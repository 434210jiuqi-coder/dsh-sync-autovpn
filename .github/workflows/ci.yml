name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # 插件是 Windows 向的（junction / 注册表 / 系统代理 / 任务计划），用 windows 跑最贴近真实
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 语法检查
        run: |
          node --check lib/index.js
          node --check lib/trigger.js
          node --check lib/log.js

      - name: 单元测试（触发层：假引擎 + 假代理，不联网）
        run: node test/trigger.test.mjs

      - name: 装载预检（没有 DSH 环境时自动 SKIP）
        run: node test/plugin-load.mjs

      - name: 服务接线预检（没有 DSH 环境时自动 SKIP）
        run: node test/wiring.test.mjs
